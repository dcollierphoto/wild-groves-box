<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Foxy Labels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Layout: heading, then a grid of the flat labels; double-click opens one full size with arrows through the rest. */
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#26241f; --muted:#6f6a5e; --line:#e2ddd2; --pink:#dc4e90;
  --display:'Oswald','Arial Narrow',sans-serif; --body:'Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:1200px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer}
.pill:hover{color:var(--pink);border-color:var(--pink)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);letter-spacing:.05em;text-transform:uppercase;margin:4px 0 2px}
h1 span{color:var(--pink)}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font:inherit;color:inherit}
.card .img{position:relative;aspect-ratio:2000/1856;border-radius:8px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s, transform .15s}
.card:hover .img{box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .cap{display:grid;gap:3px;min-height:1.4em}
.card .cap .file{justify-self:start;font:500 11.5px/1.3 var(--body);letter-spacing:.02em;color:var(--muted);background:none;border:0;padding:0;cursor:copy;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.card .cap .file:hover{color:var(--ink);text-decoration:underline}
.card .cap .file.done{color:var(--pink)}
.card .cap small{font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:none}
.card .cap b{font:600 15px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .x{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#fffffff0;color:var(--ink);font:600 16px/1 var(--body);opacity:0;transition:opacity .15s;cursor:pointer;border:1px solid var(--line)}
.card .zoom{position:absolute;top:8px;left:8px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#fffffff0;color:var(--ink);font:600 15px/1 var(--body);opacity:0;transition:opacity .15s;cursor:zoom-in;border:1px solid var(--line)}
.card:hover .zoom,.card .zoom:focus-visible{opacity:1}
.card .zoom:hover{color:var(--pink)}
.card:hover .x,.card .x:focus-visible{opacity:1}
.card .x:hover{color:#b3261e}
@media (hover:none){ .card .x,.card .zoom{opacity:.9} }
.card:focus-visible{outline:none}
.card:focus-visible .img{outline:3px solid var(--pink);outline-offset:3px}
.card.ghost{opacity:.3}
.card.chosen .img{box-shadow:0 10px 26px rgba(0,0,0,.22)}

/* full-size view */
.lb{position:fixed;inset:0;z-index:20;background:rgba(24,23,21,.94);display:grid;grid-template-rows:auto 1fr auto;color:#f3f1ec;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lb .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb .title{font:600 14px/1.3 var(--body)}
.lb .title small{display:block;font-size:12px;font-weight:500;color:#bdb6a8}
.lb .stage{position:relative;display:grid;place-items:center;min-height:0;touch-action:pan-y}
.lb .stage img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #ffffff40;background:#00000055;color:#fff;font:400 26px/1 var(--body);cursor:pointer;display:grid;place-items:center}
.lb .nav:hover{background:#000000aa}
.lb .prev{left:4px} .lb .next{right:4px}
.lb .foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-top:10px}
.lb .pill{color:#f3f1ec;border-color:#ffffff40}
.lb .pill:hover{color:#fff;border-color:var(--pink);background:var(--pink)}
.lb .count{font:500 12px/1 var(--body);color:#bdb6a8;align-self:center}
.status{margin:-10px 0 18px;font:600 13px/1.3 var(--body);color:var(--muted)}
.status.good{color:#3f6b2a} .status.bad{color:#b3261e}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="pill" href="../">← Back to the bottle</a>
    <a class="pill" href="../../packaging/">All products</a>
  </div>
  <h1><span>Foxy</span> Labels</h1>
  <p class="lede">Click a label to see it on the bottle. Double-click it, or use the ⤢ button, to see it full size and arrow through them all.</p>
  <p class="status" id="status" hidden aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <p style="margin-top:22px"><button type="button" class="pill" id="reset" hidden>Show hidden labels</button></p>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Full-size label">
  <div class="bar">
    <div class="title" id="lbTitle"></div>
    <button type="button" class="pill" id="lbClose">Close</button>
  </div>
  <div class="stage" id="lbStage">
    <img id="lbImg" alt="">
    <button type="button" class="nav prev" id="lbPrev" aria-label="Previous label">‹</button>
    <button type="button" class="nav next" id="lbNext" aria-label="Next label">›</button>
  </div>
  <div class="foot">
    <span class="count" id="lbCount"></span>
    <a class="pill" id="lbBottle" href="../">See it on the bottle</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script type="module">
// The label list (and the product's name and colour) comes from labels.json, which the studio page edits.
// On a device with David's studio key, this page reads the list straight from GitHub and saves
// his order and hidden labels back to it, so everyone sees his order. Everyone else just views.
const KEY=(()=>{ try{ return localStorage.getItem('studio-key')||''; }catch(e){ return ''; } })();
const API='https://api.github.com/repos/dcollierphoto/wild-groves-box';
const FOLDER=location.pathname.split('/').filter(Boolean).slice(-2)[0];
const LPATH=`${FOLDER}/labels.json`;
const fromB64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const toB64=s=>{ const b=new TextEncoder().encode(s); let x=''; for(let i=0;i<b.length;i+=0x8000) x+=String.fromCharCode(...b.subarray(i,i+0x8000)); return btoa(x); };
async function ghList(){
  const r=await fetch(`${API}/contents/${LPATH}?ref=main&t=${Date.now()}`,{headers:{Authorization:'Bearer '+KEY,Accept:'application/vnd.github+json'}});
  if(!r.ok) throw Object.assign(new Error('gh'),{status:r.status});
  const j=await r.json(); return {man:JSON.parse(fromB64(j.content)), sha:j.sha};
}
let canEdit=false, fileSha=null, live=null;
if(KEY){ try{ const g=await ghList(); live=g.man; fileSha=g.sha; canEdit=true; }catch(e){} }
const MAN = live || await fetch('../labels.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null) || {"product": {"key": "foxy", "name": "Foxy", "sub": "Highest polyphenol \u00b7 500 mL", "color": "#dc4e90"}, "labels": [{"id": "01", "name": "Painted Fox", "full": "img/01.webp", "thumb": "img/t01.webp", "card": "img/c01.webp"}, {"id": "14", "name": "Pink Panel Ripening", "full": "img/14.webp", "thumb": "img/t14.webp", "card": "img/c14.webp"}, {"id": "13", "name": "Ripening Branch", "full": "img/13.webp", "thumb": "img/t13.webp", "card": "img/c13.webp"}, {"id": "03", "name": "Pink Panel", "full": "img/03.webp", "thumb": "img/t03.webp", "card": "img/c03.webp"}, {"id": "08", "name": "Painted Branch", "full": "img/08.webp", "thumb": "img/t08.webp", "card": "img/c08.webp"}, {"id": "11", "name": "Fire Fox", "full": "img/11.webp", "thumb": "img/t11.webp", "card": "img/c11.webp"}, {"id": "12", "name": "Painted Fox Red", "full": "img/12.webp", "thumb": "img/t12.webp", "card": "img/c12.webp"}, {"id": "04", "name": "Oil Splash", "full": "img/04.webp", "thumb": "img/t04.webp", "card": "img/c04.webp"}, {"id": "05", "name": "Black Foxy", "full": "img/05.webp", "thumb": "img/t05.webp", "card": "img/c05.webp"}, {"id": "06", "name": "Hand-Lettered", "full": "img/06.webp", "thumb": "img/t06.webp", "card": "img/c06.webp"}, {"id": "07", "name": "Golden", "full": "img/07.webp", "thumb": "img/t07.webp", "card": "img/c07.webp"}, {"id": "02", "name": "Harvest Branch", "full": "img/02.webp", "thumb": "img/t02.webp", "card": "img/c02.webp"}, {"id": "09", "name": "Olive Row", "full": "img/09.webp", "thumb": "img/t09.webp", "card": "img/c09.webp"}, {"id": "10", "name": "Big Olives", "full": "img/10.webp", "thumb": "img/t10.webp", "card": "img/c10.webp"}], "removed": [], "rev": 13, "updated": "2026-10-26T20:12:01.438Z"};
const P = Object.assign({key:'foxy', name:'', color:''}, MAN.product||{});
const LABELS = MAN.labels||[];
if(P.name){ document.title=P.name+' Labels'; document.querySelector('h1 span').textContent=P.name; }
if(P.color) document.documentElement.style.setProperty('--pink',P.color);
const NAMES = LABELS.map(L=>L.name);
const N = MAN.rev || LABELS.length;
const full = i => '../'+LABELS[i].full;
const card = i => '../'+(LABELS[i].card||LABELS[i].full);
const slug = i => NAMES[i].toLowerCase().replace(/[^a-z0-9]+/g,'-');
// one order for everyone: the list's own order; hidden labels carry hidden:true in the list
const ids=LABELS.map(L=>L.id);
let order=LABELS.map((_,i)=>i);
let hidden=LABELS.map((L,i)=>L.hidden?i:-1).filter(i=>i>=0);
// a browser without the studio key keeps its own order and hidden labels (saved by label id)
const readLocal=k=>{ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return Array.isArray(v)?v:null; }catch(e){ return null; } };
const localIdx=k=>(readLocal(k)||[]).map(v=>typeof v==='number'?String(v+1).padStart(2,'0'):String(v)).map(id=>LABELS.findIndex(L=>L.id===id)).filter(i=>i>=0);
if(!canEdit){ const lo=localIdx(P.key+'-order'), lh=readLocal(P.key+'-hidden');
  if(lo.length) order=[...lo, ...order.filter(i=>!lo.includes(i))]; if(lh) hidden=localIdx(P.key+'-hidden'); }
let myRev=MAN.rev||0, saveTimer=null, saving=false, again=false;
const status=document.getElementById('status');
const say=(text,kind='')=>{ status.textContent=text; status.className='status '+kind; status.hidden=!text; };
const save=()=>{ if(!canEdit){ try{ localStorage.setItem(P.key+'-order',JSON.stringify(order.map(i=>ids[i]))); localStorage.setItem(P.key+'-hidden',JSON.stringify(hidden.map(i=>ids[i]))); }catch(e){} return; } clearTimeout(saveTimer); say('Saving your order…'); saveTimer=setTimeout(push,900); };
async function push(){
  if(saving){ again=true; return; } saving=true;
  try{
    const g=await ghList();
    if((g.man.rev||0)!==myRev){ say('This list was changed somewhere else (maybe the studio). Reload the page, then set the order again.','bad'); return; }
    const byId=Object.fromEntries(g.man.labels.map(L=>[L.id,L]));
    const next=order.map(i=>ids[i]).filter(id=>byId[id]).map(id=>{ const L={...byId[id]}; if(hidden.includes(ids.indexOf(id))) L.hidden=true; else delete L.hidden; return L; });
    g.man.labels.forEach(L=>{ if(!next.some(x=>x.id===L.id)) next.push(L); });
    const out={...g.man, labels:next, rev:myRev+1, updated:new Date().toISOString()};
    const r=await fetch(`${API}/contents/${LPATH}`,{method:'PUT',headers:{Authorization:'Bearer '+KEY,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:`Labels page: ${P.name||FOLDER} order`, content:toB64(JSON.stringify(out,null,1)+'\n'), sha:g.sha, branch:'main'})});
    if(!r.ok) throw Object.assign(new Error('put'),{status:r.status});
    myRev=out.rev; say('Saved for everyone. Other devices update in a minute or two.','good');
  }catch(e){
    say(e.status===401||e.status===403 ? 'GitHub refused the save. Your studio key may have expired; set a new one in the studio.' : 'Couldn\'t save just now. Move a label again to retry.','bad');
  }finally{ saving=false; if(again){ again=false; push(); } }
}
const visible=()=>order.filter(i=>!hidden.includes(i));
function copyName(el, text){
  const done=()=>{ const was=el.textContent; el.classList.add('done'); el.textContent='Copied'; setTimeout(()=>{ el.textContent=was; el.classList.remove('done'); },1200); };
  try{ navigator.clipboard.writeText(text).then(done,()=>{}); }catch(e){}
}
const grid=document.getElementById('grid'), reset=document.getElementById('reset');
const touch = matchMedia('(hover:none)').matches;

function render(){
  grid.innerHTML='';
  visible().forEach(i=>{
    const c=document.createElement('div'); c.className='card'; c.tabIndex=0; c.dataset.i=i;
    c.setAttribute('role','button'); c.setAttribute('aria-label',`${NAMES[i]}. Show on the bottle`);
    c.innerHTML=`<div class="img"><img src="${card(i)}" alt="" draggable="false" loading="lazy"><button type="button" class="x" aria-label="Hide ${NAMES[i]}" title="Hide this one">×</button><button type="button" class="zoom" aria-label="View ${NAMES[i]} full size" title="Full size">⤢</button></div>
      <div class="cap"><b></b></div>`;
    c.querySelector('.cap b').textContent=NAMES[i];
    // the original design file's name, so David can find the source; click it to copy
    if(LABELS[i].file){ const f=document.createElement('button'); f.type='button'; f.className='file'; f.title='Click to copy the file name';
      f.textContent=LABELS[i].file; c.querySelector('.cap').append(f);
      f.onclick=e=>{ e.stopPropagation(); copyName(f, LABELS[i].file); }; f.ondblclick=e=>e.stopPropagation(); }
    c.querySelector('.x').onclick=e=>{ e.stopPropagation(); if(visible().length<=1) return; hidden.push(i); save(); render(); };
    // desktop: double-click opens; touch: a tap opens (double-tap zooms the page on phones)
    // one click puts it on the bottle; a double-click (or the expand button) opens it full size
    let clickTimer=null;
    const toBottle=()=>{ location.href='../?v='+N+'#'+slug(i); };
    c.onclick=e=>{ if(e.target.closest('.x,.zoom,.file')) return; clearTimeout(clickTimer); clickTimer=setTimeout(toBottle, touch?0:260); };
    c.ondblclick=e=>{ if(e.target.closest('.x,.zoom')) return; clearTimeout(clickTimer); open(i); };
    c.querySelector('.zoom').onclick=e=>{ e.stopPropagation(); clearTimeout(clickTimer); open(i); };
    c.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); location.href='../?v='+N+'#'+slug(i); } else if(e.key===' '){ e.preventDefault(); open(i); } };
    grid.append(c);
  });
  reset.hidden = !hidden.length; reset.textContent = `Show hidden labels (${hidden.length})`;
}
// if the drag library can't load, the page still works without reordering
if(window.Sortable) Sortable.create(grid,{ animation:180, delay:220, delayOnTouchOnly:true, filter:'.x,.zoom,.file', preventOnFilter:false,
  ghostClass:'ghost', chosenClass:'chosen', forceFallback:true, fallbackTolerance:4,
  onEnd(){ const vis=[...grid.children].map(c=>+c.dataset.i); order=[...vis, ...order.filter(k=>!vis.includes(k))]; save(); render(); } });
// brings hidden labels back without touching the custom order
reset.onclick=()=>{ hidden=[]; save(); render(); };
if(KEY && !canEdit) say('This browser has a studio key, but GitHub didn\'t accept it, so reordering is off. Open the Label Studio to set a new key.','bad');
if(canEdit) document.querySelector('.lede').textContent='Drag a label to set the order everyone sees, and the × hides one. Click a label to see it on the bottle; double-click it, or use the ⤢ button, to see it full size.';

// full-size view
const lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg');
let at=0, lastFocus=null;
function show(){
  const v=visible(), i=v[at];
  lbImg.src=full(i); lbImg.alt=`${P.name||'Foxy'} label, ${NAMES[i]}`;
  const tt=document.getElementById('lbTitle'); tt.textContent=NAMES[i];
  if(LABELS[i].file){ const s=document.createElement('small'); s.textContent=LABELS[i].file; tt.append(s); }
  document.getElementById('lbCount').textContent=`${at+1} of ${v.length}`;
  document.getElementById('lbBottle').href='../?v='+N+'#'+slug(i);
  const nx=v[(at+1)%v.length]; new Image().src=full(nx);
}
function open(i){ at=Math.max(0,visible().indexOf(i)); lastFocus=document.activeElement; lb.hidden=false; document.body.style.overflow='hidden'; show(); document.getElementById('lbClose').focus(); }
function close(){ lb.hidden=true; document.body.style.overflow=''; if(lastFocus) lastFocus.focus(); }
const step=d=>{ const n=visible().length; at=(at+d+n)%n; show(); };
document.getElementById('lbPrev').onclick=()=>step(-1);
document.getElementById('lbNext').onclick=()=>step(1);
document.getElementById('lbClose').onclick=close;
lb.addEventListener('click',e=>{ if(e.target===lb||e.target.id==='lbStage') close(); });
addEventListener('keydown',e=>{ if(lb.hidden) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); step(1); } else if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1); } else if(e.key==='Escape') close(); });
// swipe on phones
let sx=null; const st=document.getElementById('lbStage');
st.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
st.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) step(dx<0?1:-1); sx=null; });

// Before this change each browser kept its own order. If this browser still has one, offer to make it everyone's.
if(canEdit){
  const read=k=>{ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return Array.isArray(v)?v:null; }catch(e){ return null; } };
  const toId=v=> typeof v==='number' ? String(v+1).padStart(2,'0') : String(v);
  const oldO=(read(P.key+'-order')||[]).map(toId).map(id=>ids.indexOf(id)).filter(i=>i>=0);
  const oldH=(read(P.key+'-hidden')||[]).map(toId).map(id=>ids.indexOf(id)).filter(i=>i>=0);
  const forget=()=>{ try{ localStorage.removeItem(P.key+'-order'); localStorage.removeItem(P.key+'-hidden'); }catch(e){} };
  if(oldO.length || oldH.length){
    const fullOld=[...oldO, ...order.filter(i=>!oldO.includes(i))];
    if(fullOld.join()!==order.join() || oldH.sort().join()!==[...hidden].sort().join()){
      const box=document.createElement('p'); box.className='status'; box.innerHTML='This browser still has the order you set earlier. <button type="button" class="pill" id="useOld">Use it for everyone</button> <button type="button" class="pill" id="noOld">No thanks</button>';
      status.after(box);
      box.querySelector('#useOld').onclick=()=>{ order=fullOld; hidden=oldH; forget(); box.remove(); render(); save(); };
      box.querySelector('#noOld').onclick=()=>{ forget(); box.remove(); };
    } else forget();
  }
}
render();
</script>
</body>
</html>
