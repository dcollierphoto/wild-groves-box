const D = {"G": 1560, "FX": 800, "Z": 1.25, "TX": -260.0, "TY": -390.0, "SPOTS": [[252.2, 1125.1, 0.78], [270.9, 1133.1, 0.78], [232.0, 944.8, 0.78], [250.7, 952.8, 0.78], [346.4, 916.8, 0.78], [365.0, 924.8, 0.78], [436.2, 963.1, 0.78], [454.9, 971.1, 0.78], [463.6, 796.8, 0.78], [482.3, 804.8, 0.78], [488.1, 1052.5, 0.78], [506.8, 1060.5, 0.78], [575.2, 855.4, 0.78], [593.9, 863.4, 0.78], [650.6, 1156.8, 0.78], [669.4, 1164.8, 0.78], [646.9, 1037.1, 0.78], [665.6, 1045.1, 0.78], [782, 983, 1.0], [748, 1007, 1.0], [706, 1019, 1.0]], "RIM": 1380, "BOXC": 675, "STACK": [675, 1440], "CARRY": 1408, "HOME": 797, "LEFT": 553, "REACH": 94, "BOXOFF": 84, "HANDY": 1316.8799999999999, "HAT": 1086, "XMIN": 262, "XMAX": 1018, "V": 620, "LAY": 0.3, "NSLOT": 21, "POSES": ["idle", "reach", "held", "run0", "run1", "carry0", "carry1", "lay0", "lay1", "boxS", "box0", "box1", "sad"]};
const $ = id => document.getElementById(id), show = (el, on) => { el.style.display = on ? '' : 'none'; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const film = $('film');
let best = { hand: 0, box: 0 }, state = 'menu', g = null, mute = false, boil = !matchMedia('(prefers-reduced-motion: reduce)').matches;
try { const b = JSON.parse(localStorage.getItem('olive-catch-best') || 'null'); if (b) best = Object.assign(best, b); } catch (e) {}

// ---------- sound: tiny synthesized taps and plinks, started by the first tap
let AC = null;
function ac() { if (mute) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } return AC; }
function tone(f, d, vol, f2, delay = 0) { const a = ac(); if (!a) return; const t = a.currentTime + delay, o = a.createOscillator(), v = a.createGain(); o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + 0.02); }
function hiss(d, vol, freq) { const a = ac(); if (!a) return; const n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n); const s = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8; v.gain.value = vol; s.connect(f).connect(v).connect(a.destination); s.start(); }
const sfx = {
  wiggle: () => hiss(0.3, 0.16, 3600), drop: () => tone(1568, 0.3, 0.1),
  grab: () => { tone(300, 0.07, 0.3); hiss(0.05, 0.1, 1500); },
  inbox: n => { tone(220, 0.07, 0.25); tone([1047, 1175, 1319, 1397, 1568][n % 5], 0.18, 0.08); },
  miss: () => { tone(130, 0.22, 0.4, 70); hiss(0.12, 0.12, 500); },
  bonk: () => { tone(392, 0.45, 0.2); tone(250, 0.1, 0.3); },
  full: () => { tone(1568, 0.6, 0.16); tone(2093, 0.7, 0.14, null, 0.12); },
  over: () => { tone(392, 0.3, 0.2); tone(330, 0.3, 0.2, null, 0.22); tone(262, 0.7, 0.2, null, 0.44); },
};

// ---------- a game
function newGame(mode) {
  return { mode, t: 0, score: 0, miss: 0, boxes: 0, pile: 0, fullT: 0, n: 0, next: 1.1, X: mode === 'hand' ? D.HOME : 760, face: -1, tgt: null, queued: null, stand: D.HOME,
    phase: 'free', pt: 0, moving: false, bonkT: 0, bonkX: 0, caught: false, keys: {}, splats: [],
    olives: D.SPOTS.map((s, i) => ({ i, x0: s[0], y0: s[1], s0: s[2], st: 'ready', t: 0, x: s[0], y: s[1], vx: 0, vy: 0, spin: 0, bonked: false })) };
}
const interval = () => g.mode === 'hand' ? Math.max(1.45, 2.8 * Math.pow(0.97, g.n)) : Math.max(0.42, 1.7 * Math.pow(0.965, g.n));
const warn = () => Math.max(0.45, Math.pow(0.985, g.n));
const grav = () => Math.min(2000, 1050 * (1 + 0.012 * g.n));
const cap = () => g.mode === 'hand' ? D.NSLOT : 13;
function start(mode) { g = newGame(mode); state = 'play'; ac(); hud(true); }
function aim(px) {                                        // the player points at a spot: stand so the hand (or the box) is right there
  if (state !== 'play') return;
  px = clamp(px, 222, 1058); const off = g.mode === 'hand' ? D.REACH : D.BOXOFF;
  let side = g.X >= px ? 1 : -1, x = px + side * off;
  if (x > D.XMAX) { side = -1; x = px - off; } if (x < D.XMIN) { side = 1; x = px + off; }
  const t = { x: clamp(x, D.XMIN, D.XMAX), face: -side, mark: px };
  if (g.mode === 'hand' && g.phase !== 'free') g.queued = t; else g.tgt = t;
}
function moveTo(x, dt) { const d = x - g.X, step = D.V * dt; if (Math.abs(d) <= step) { g.X = x; return true; } g.X += Math.sign(d) * step; g.face = Math.sign(d); g.moving = true; return false; }
function addOlive() { g.score++; g.pile++; sfx.inbox(g.score); if (g.pile >= cap() && g.fullT <= 0) g.fullT = 0.55; }
function lose(o) {
  g.splats.push({ x: o.x, t: 3 }); if (g.splats.length > 6) g.splats.shift(); g.miss++; sfx.miss();
  if (g.miss >= 3) { state = 'over'; sfx.over(); const nb = g.score > best[g.mode]; if (nb) { best[g.mode] = g.score; try { localStorage.setItem('olive-catch-best', JSON.stringify(best)); } catch (e) {} } g.newBest = nb; hud(false); }
}
function gone(o) { o.st = 'gone'; o.t = 2.5 + Math.random() * 2; o.bonked = false; o.vx = 0; }
function update(dt) {
  g.t += dt; g.moving = false;
  if (g.fullT > 0) { g.fullT -= dt; if (g.fullT <= 0) { g.pile = Math.max(0, g.pile - cap()); g.boxes++; sfx.full(); } }
  if (g.bonkT > 0) g.bonkT -= dt;
  // the farmer
  const free = g.mode === 'box' || g.phase === 'free';
  const dir = (g.keys.r ? 1 : 0) - (g.keys.l ? 1 : 0);
  if (free && dir) { g.tgt = null; g.X = clamp(g.X + dir * D.V * dt, D.XMIN, D.XMAX); g.face = dir; g.moving = true; }
  else if (free) { if (g.tgt && moveTo(g.tgt.x, dt)) g.face = g.tgt.face; }
  else if (g.phase === 'held') { g.pt -= dt; if (g.pt <= 0) { g.phase = 'carry'; g.stand = Math.abs(g.X - D.HOME) < Math.abs(g.X - D.LEFT) ? D.HOME : D.LEFT; } }
  else if (g.phase === 'carry') { if (moveTo(g.stand, dt)) { g.face = g.stand === D.HOME ? -1 : 1; g.phase = 'lay'; g.pt = D.LAY; } }
  else if (g.phase === 'lay') { g.pt -= dt; if (g.pt <= 0) { addOlive(); g.phase = 'free'; g.tgt = g.queued; g.queued = null; } }
  // the tree lets go of another one
  g.next -= dt;
  if (g.next <= 0) {
    const ready = g.olives.filter(o => o.st === 'ready');
    if (ready.length) { const o = ready[Math.floor(Math.random() * ready.length)]; o.st = 'wiggle'; o.t = warn(); g.n++; g.next = interval(); sfx.wiggle(); } else g.next = 0.2;
  }
  const G0 = grav(), boxX = g.X + D.BOXOFF * g.face, boxTop = D.CARRY - 60, handX = g.X + D.REACH * g.face;
  for (const o of g.olives) {
    if (o.st === 'wiggle') { o.t -= dt; if (o.t <= 0) { o.st = 'fall'; o.x = o.x0; o.y = o.y0; o.vy = 0; o.vx = 0; o.spin = 0; sfx.drop(); } }
    else if (o.st === 'gone') { o.t -= dt; if (o.t <= 0) { o.st = 'grow'; o.t = 0.35; } }
    else if (o.st === 'grow') { o.t -= dt; if (o.t <= 0) o.st = 'ready'; }
    else if (o.st === 'fall') {
      const y0 = o.y; o.vy += G0 * dt; o.y += o.vy * dt; o.x += o.vx * dt; o.spin += 300 * dt;
      if (state !== 'play') continue;
      if (!o.bonked && o.vy > 0 && Math.abs(o.x - g.X) < 34 && o.y >= D.HAT - 8 && y0 < D.HAT + 30) { o.bonked = true; o.vx = (o.x >= g.X ? 1 : -1) * 240; o.vy = -320; g.bonkT = 0.5; g.bonkX = g.X; sfx.bonk(); continue; }
      if (g.mode === 'box' && !o.bonked && Math.abs(o.x - boxX) < 54 && o.y >= boxTop - 8 && y0 <= boxTop + 30) { gone(o); addOlive(); continue; }
      if (g.mode === 'hand' && Math.abs(o.x - D.BOXC) < 54 && o.y >= D.RIM - 14 && y0 <= D.RIM + 20) { gone(o); addOlive(); continue; }
      if (g.mode === 'hand' && g.phase === 'free' && !o.bonked && Math.abs(o.x - handX) < 46 && o.y >= D.HANDY - 34 && y0 <= D.HANDY + 26) { gone(o); g.phase = 'held'; g.pt = 0.12; g.caught = true; sfx.grab(); continue; }
      if (o.y >= D.G - 12) { o.y = D.G - 12; lose(o); gone(o); }
    }
  }
  for (const s of g.splats) s.t -= dt;
}

// ---------- drawing
let lastSeed = -1, lastPose = '', lastScore = -1;
function pose() {
  if (state === 'over') return 'sad'; if (state === 'menu') return 'idle';
  const k = Math.floor(g.t * 6) % 2;
  if (g.mode === 'box') return g.moving ? 'box' + k : 'boxS';
  if (g.phase === 'held') return 'held'; if (g.phase === 'carry') return 'carry' + (g.moving ? k : 0); if (g.phase === 'lay') return g.pt > D.LAY / 2 ? 'lay0' : 'lay1';
  return g.moving ? 'run' + k : 'reach';
}
function draw(now) {
  if (boil) { const seed = 1 + Math.floor(now / 125) % 6; if (seed !== lastSeed) { lastSeed = seed; $('turb').setAttribute('seed', seed); $('turb2').setAttribute('seed', seed + 6); } }
  const p = pose(), k = Math.floor(g.t * 6) % 2;
  if (p !== lastPose) { D.POSES.forEach(q => show($('p_' + q), q === p)); lastPose = p; }
  const sq = g.bonkT > 0.38 ? 0.9 : g.bonkT > 0.3 ? 1.04 : 1;
  $('man').setAttribute('transform', `translate(${g.X - D.FX} 0)` + (sq !== 1 ? ` translate(${D.FX} ${D.G}) scale(${2 - sq} ${sq}) translate(${-D.FX} ${-D.G})` : '') + (g.face > 0 ? ` translate(${2 * D.FX} 0) scale(-1 1)` : ''));
  const box = g.mode === 'box';
  const bx = box ? g.X + D.BOXOFF * g.face : D.STACK[0], by = box ? D.CARRY - (g.moving && k ? 8 : 0) : D.STACK[1];
  $('boxgrp').setAttribute('transform', `translate(${bx - D.STACK[0]} ${by - D.STACK[1]})`);
  show($('stackLow'), !box); show($('boxover'), box || g.phase === 'lay');
  const n = Math.min(g.pile, cap()); for (let i = 0; i < D.NSLOT; i++) show($('s' + i), i < n);
  const w = Math.floor(now / 83) % 2 ? 5 : -5;
  for (const o of g.olives) {
    const el = $('o' + o.i);
    if (o.st === 'gone') { show(el, false); continue; }
    show(el, true); show($('k' + o.i), o.st === 'wiggle');
    if (o.st === 'fall') el.setAttribute('transform', `translate(${o.x} ${o.y}) rotate(${o.spin}) scale(${Math.min(1, o.s0 + (o.y - o.y0) / 300)})`);
    else if (o.st === 'wiggle') el.setAttribute('transform', `translate(${o.x0 + w} ${o.y0}) rotate(${w * 3}) scale(${o.s0 * 1.25})`);
    else el.setAttribute('transform', `translate(${o.x0} ${o.y0}) scale(${o.s0 * (o.st === 'grow' ? 1 - o.t / 0.35 : 1)})`);
  }
  for (let i = 0; i < 6; i++) { const s = g.splats[i], el = $('x' + i); show(el, !!s && s.t > 0); if (s && s.t > 0) { el.setAttribute('transform', `translate(${s.x} ${D.G - 6})`); el.style.opacity = Math.min(1, s.t); } }
  const m = state === 'play' && (g.queued || g.tgt); show($('mark'), !!m); if (m) $('mark').setAttribute('transform', `translate(${m.mark} ${D.G + 30})`);
  show($('bonk'), g.bonkT > 0); if (g.bonkT > 0) $('bonk').setAttribute('transform', `translate(${g.bonkX + 150} ${D.HAT - 40 - 40 * (0.5 - g.bonkT)})`);
  if (g.score !== lastScore) { lastScore = g.score; $('score').textContent = g.score; }
  for (let i = 0; i < 3; i++) show($('lost' + i), i < g.miss);
  show($('tally'), g.boxes > 0); if (g.boxes > 0) $('boxes').textContent = '× ' + g.boxes;
  if (state === 'play' && !g.hinted && g.score > 0) { g.hinted = true; $('hint').textContent = ''; }
}
function hud(playing) {
  show($('hud'), state !== 'menu'); show($('menu'), !playing); show($('score'), playing);
  if (playing) $('hint').textContent = g.mode === 'hand' ? 'Tap under a wiggling olive.' : 'Tap or drag to move the box.';
  else {
    $('hint').textContent = '';
    if (state === 'over') { $('title').textContent = 'Almost.'; $('sub').textContent = (g.newBest ? 'New best! ' : '') + g.score + (g.score === 1 ? ' olive' : ' olives') + ' in the box.'; }
    $('bestHand').textContent = best.hand ? 'best: ' + best.hand : ''; $('bestBox').textContent = best.box ? 'best: ' + best.box : '';
  }
}

// ---------- input
function artX(e) { const r = film.getBoundingClientRect(); return ((e.clientX - r.left) / r.width * 1080 - D.TX) / D.Z; }
let down = false;
film.addEventListener('pointerdown', e => { if (e.target.closest('.btn')) return; down = true; aim(artX(e)); });
film.addEventListener('pointermove', e => { if (down && state === 'play' && g.mode === 'box') aim(artX(e)); });
addEventListener('pointerup', () => { down = false; }); addEventListener('pointercancel', () => { down = false; });
const press = (id, fn) => { const el = $(id); el.addEventListener('click', fn); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); };
press('bHand', () => start('hand')); press('bBox', () => start('box'));
press('bSound', () => { mute = !mute; $('soundT').textContent = 'sound: ' + (mute ? 'off' : 'on'); });
addEventListener('keydown', e => { if (state !== 'play') return; if (e.key === 'ArrowLeft') g.keys.l = true; if (e.key === 'ArrowRight') g.keys.r = true; });
addEventListener('keyup', e => { if (!g) return; if (e.key === 'ArrowLeft') g.keys.l = false; if (e.key === 'ArrowRight') g.keys.r = false; });

// ---------- go
let last = 0, slow = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (boil && dt > 0.034) { if (++slow > 90) { boil = false; } }        // a slow phone: stop the lines from boiling so the game stays quick
  if (state === 'play') update(dt); else if (state === 'over') { g.t += dt; for (const o of g.olives) if (o.st === 'fall') { o.vy += 1500 * dt; o.y = Math.min(D.G - 12, o.y + o.vy * dt); } }
  draw(now); requestAnimationFrame(frame);
}
function boot(data) { if (data && data.best) best = Object.assign(best, data.best); g = newGame('hand'); state = 'menu'; hud(false); requestAnimationFrame(frame); }
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ best }));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
window.oliveCatch = { get g() { return g; }, get state() { return state; }, aim, start };
})();
</script>
</body></html>
