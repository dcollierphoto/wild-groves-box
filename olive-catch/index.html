    olives: D.SPOTS.map((s, i) => ({ i, x0: s[0], y0: s[1], s0: s[2], st: 'ready', t: 0, x: s[0], y: s[1], vx: 0, vy: 0, spin: 0, bonked: false })) };
}
const interval = () => g.mode === 'hand' ? Math.max(1.7, 3.4 * Math.pow(0.98, g.n)) : Math.max(0.55, 2.0 * Math.pow(0.97, g.n));
const warn = () => Math.max(0.6, 1.5 * Math.pow(0.985, g.n));
const grav = () => Math.min(1700, 850 * (1 + 0.01 * g.n));
const cap = k => k === 'C' ? 13 : D.NSLOT;
function hint(text, secs) { $('hint').textContent = text; g.hintT = secs; }
function start(mode) { g = newGame(mode); state = 'play'; ac(); hud(true); hint(mode === 'hand' ? 'Tap under a wiggling olive.' : 'Tap or drag to move the box.', 6); }
function aim(px) {                                        // the player points at a spot: stand so the hand (or the box) is right there
  if (state !== 'play') return;
  px = clamp(px, D.PXMIN, D.PXMAX); const off = g.mode === 'hand' ? D.REACH : D.BOXOFF;
  let side = g.X >= px ? 1 : -1, x = px + side * off;
  if (x > D.XMAX) { side = -1; x = px - off; } if (x < D.XMIN) { side = 1; x = px + off; }
  const t = { x: clamp(x, D.XMIN, D.XMAX), face: -side, mark: px };

}
function moveTo(x, dt) { const d = x - g.X, step = D.V * dt; if (Math.abs(d) <= step) { g.X = x; return true; } g.X += Math.sign(d) * step; g.face = Math.sign(d); g.moving = true; return false; }
function addOlive(k) { const p = g.piles[k]; g.score++; p.n++; sfx.inbox(g.score); if (p.n >= cap(k) && p.full <= 0) p.full = 0.55; }
function strike() {
  g.miss++; sfx.miss();
  if (g.miss >= 3) { state = 'over'; sfx.over(); const nb = g.score > best[g.mode]; if (nb) { best[g.mode] = g.score; try { localStorage.setItem('olive-catch-best-v4', JSON.stringify(best)); } catch (e) {} } g.newBest = nb; hud(false); }
}
function say(msg, x, squash) { g.bonkT = 0.6; g.bonkX = x; g.squash = squash; $('bonkT').textContent = msg; }
function gone(o) { o.st = 'gone'; o.t = 2.5 + Math.random() * 2; o.bonked = false; o.vx = 0; }
function update(dt) {
  g.t += dt; g.moving = false;
  for (const k in g.piles) { const p = g.piles[k]; if (p.full > 0) { p.full -= dt; if (p.full <= 0) { p.n = Math.max(0, p.n - cap(k)); g.boxes++; sfx.full(); } } }
  if (g.bonkT > 0) g.bonkT -= dt;
  if (g.hintT > 0) { g.hintT -= dt; if (g.hintT <= 0) $('hint').textContent = ''; }
  // the farmer
  if (g.stun > 0) g.stun -= dt;
  const free = (g.mode === 'box' || g.phase === 'free') && g.stun <= 0;
  const dir = (g.keys.r ? 1 : 0) - (g.keys.l ? 1 : 0);
  if (free && dir) { g.tgt = null; g.X = clamp(g.X + dir * D.V * dt, D.XMIN, D.XMAX); g.face = dir; g.moving = true; }
  else if (free) { if (g.tgt && moveTo(g.tgt.x, dt)) g.face = g.tgt.face; }
  else if (g.stun > 0) {}                                 // an acorn: he stands there a moment, cross
  else if (g.phase === 'held') { g.pt -= dt; if (g.pt <= 0) { g.phase = 'carry'; g.side = Math.abs(g.X - D.SL) <= Math.abs(g.X - D.SR) ? 'L' : 'R'; g.stand = g.side === 'L' ? D.SL : D.SR; } }   // off to the nearer box
  else if (g.phase === 'carry') { if (moveTo(g.stand, dt)) { g.face = g.side === 'L' ? -1 : 1; g.phase = 'lay'; g.pt = D.LAY; } }
  else if (g.phase === 'lay') { g.pt -= dt; if (g.pt <= 0) { addOlive(g.side); g.phase = 'free'; g.tgt = g.queued; g.queued = null; } }
  // the tree lets go of another one
  g.next -= dt;
  if (g.next <= 0) {
    const ready = g.olives.filter(o => o.st === 'ready');
    if (g.n < 3) ready.sort((a, b) => Math.abs(a.x0 - g.X) - Math.abs(b.x0 - g.X)).splice(5);             // the first few fall near him, where he is looking
    if (ready.length) { const o = ready[Math.floor(Math.random() * ready.length)]; o.st = 'wiggle'; o.t = warn(); g.n++; g.next = interval(); sfx.wiggle(); } else g.next = 0.2;
  }
  const G0 = grav(), boxX = g.X + D.BOXOFF * g.face, boxTop = D.CARRY - 60, handX = g.X + D.REACH * g.face;
  for (const o of g.olives) {
    if (o.st === 'wiggle') { o.t -= dt; if (o.t <= 0) { o.st = 'fall'; o.x = o.x0; o.y = o.y0; o.vy = 0; o.vx = 0; o.spin = 0; sfx.drop(); } }
    else if (o.st === 'gone') { o.t -= dt; if (o.t <= 0) { o.st = 'grow'; o.t = 0.35; } }
    else if (o.st === 'grow') { o.t -= dt; if (o.t <= 0) o.st = 'ready'; }
    else if (o.st === 'fall') {
      const y0 = o.y; o.vy += G0 * dt; o.y += o.vy * dt; o.x += o.vx * dt; o.spin += 300 * dt;
      if (state !== 'play') continue;
      if (!o.bonked && o.vy > 0 && Math.abs(o.x - g.X) < 34 && o.y >= D.HAT - 8 && y0 < D.HAT + 30) { o.bonked = true; o.vx = (o.x >= g.X ? 1 : -1) * 240; o.vy = -320; say('bonk', g.X, true); sfx.bonk(); continue; }
      if (g.mode === 'box' && !o.bonked && Math.abs(o.x - boxX) < 54 && o.y >= boxTop - 8 && y0 <= boxTop + 30) { gone(o); addOlive('C'); continue; }
      if (g.mode === 'hand' && g.phase === 'free' && g.stun <= 0 && !o.bonked && Math.abs(o.x - handX) < 46 && o.y >= D.HANDY - 34 && y0 <= D.HANDY + 26) { gone(o); g.phase = 'held'; g.pt = 0.12; sfx.grab(); continue; }
      if (o.y >= D.G - 12) { o.y = D.G - 12; g.splats.push({ x: o.x, t: 3 }); if (g.splats.length > 6) g.splats.shift(); const offHat = o.bonked; gone(o); if (offHat) sfx.miss(); else strike(); }   // one off his hat doesn't count against him
    }
  }
  // the squirrels: after ten olives one turns up on a branch, winds up, and throws an acorn at where he is heading
  if (g.score >= 10) {
    g.sqNext -= dt;
    const busy = g.olives.some(o => o.st === 'wiggle' || o.st === 'fall');                 // a squirrel waits for a quiet moment, and the tree waits for the squirrel
    if (g.sqNext <= 0 && (!busy || g.mode === 'box') && !g.squirrels.length) {
      const used = g.squirrels.map(s => s.p), open = D.PERCH.map((_, i) => i).filter(i => !used.includes(i));
      g.squirrels.push({ p: open[Math.floor(Math.random() * open.length)], k: g.squirrels.length && g.squirrels[0].k === 0 ? 1 : 0, t: 0, thrown: false, face: -1 });
      g.sqNext = Math.max(3.0, 6 - 0.04 * g.score) * (0.8 + Math.random() * 0.4); g.next = Math.max(g.next, g.mode === 'box' ? 1.2 : 2.4); sfx.chatter();
      if (!g.sqSeen) { g.sqSeen = true; hint("Squirrels! Don't catch the acorns.", 4.5); }
    }
  }
  for (const s of g.squirrels) {
    s.t += dt; const [px, py] = D.PERCH[s.p];
    const at = g.mode === 'box' ? boxX : handX;
    if (!s.thrown) s.face = at < px ? -1 : 1;
    if (!s.thrown && s.t >= 1.1 && state === 'play') {
      s.thrown = true; sfx.toss();
      const x0 = px - s.face * 2 * D.SQS, y0 = py - 108 * D.SQS, T = 1.6, GA = D.GA, tx = clamp(at + (Math.random() - 0.5) * 90, 60, 880), ty = g.mode === 'box' ? boxTop : D.HANDY;
      g.acorns.push({ x: x0, y: y0, vx: (tx - x0) / T, vy: (ty - y0 - 0.5 * GA * T * T) / T, spin: 0, bonked: false }); if (g.acorns.length > 6) g.acorns.shift();
    }
  }
  g.squirrels = g.squirrels.filter(s => s.t < 1.9);
  for (const a of g.acorns) {
    const y0 = a.y; a.vy += D.GA * dt; a.y += a.vy * dt; a.x += a.vx * dt; a.spin += 300 * dt;
    if (state !== 'play') continue;
    if (!a.bonked && a.vy > 0 && Math.abs(a.x - g.X) < 34 && a.y >= D.HAT - 8 && y0 < D.HAT + 30) { a.bonked = true; a.vx = (a.x >= g.X ? 1 : -1) * 220; a.vy = -300; say('bonk', g.X, true); sfx.bonk(); }
    else if (g.mode === 'box' && !a.bonked && Math.abs(a.x - boxX) < 54 && a.y >= boxTop - 8 && y0 <= boxTop + 30) { a.dead = true; say('acorn!', boxX, false); g.stun = 0.9; sfx.bonk(); }
    else if (g.mode === 'hand' && g.phase === 'free' && g.stun <= 0 && !a.bonked && Math.abs(a.x - handX) < 42 && a.y >= D.HANDY - 30 && y0 <= D.HANDY + 26) { a.dead = true; say('acorn!', handX, false); g.stun = 0.9; sfx.bonk(); }
    else if (a.y >= D.G - 10) a.dead = true;
  }
  g.acorns = g.acorns.filter(a => !a.dead);
  for (const s of g.splats) s.t -= dt;
}

// ---------- drawing
let lastB = -1, lastPose = '', lastScore = -1, sqShown = ['', ''];
function pose() {
  if (state === 'over') return 'sad'; if (state === 'menu') return 'idle';
  const k = Math.floor(g.t * 6) % 2;
  if (g.stun > 0 && g.mode === 'hand') return 'sad';
  if (g.mode === 'box') return g.moving ? 'box' + k : 'boxS';
  if (g.phase === 'held') return 'held'; if (g.phase === 'carry') return 'carry' + (g.moving ? k : 0); if (g.phase === 'lay') return g.pt > D.LAY / 2 ? 'lay0' : 'lay1';
  return g.moving ? 'run' + k : 'reach';
}
function draw(now) {
  const b = boil ? Math.floor(now / 125) : 0, v = b % 2;      // the lines 'boil': each drawing has two or three versions and we flip between them
  if (b !== lastB) { lastB = b; for (let i = 0; i < 3; i++) show($('bg_' + i), i === b % 3); for (const n of ['lowL', 'lowR', 'lugL', 'lugR', 'lugC']) for (let i = 0; i < 2; i++) show($(n + '_' + i), i === v); }
  const p = 'p_' + pose() + '_' + v, k = Math.floor(g.t * 6) % 2;
  if (p !== lastPose) { if (lastPose) show($(lastPose), false); show($(p), true); lastPose = p; }
  const sq = !g.squash ? 1 : g.bonkT > 0.48 ? 0.9 : g.bonkT > 0.4 ? 1.04 : 1;
  const jit = g.stun > 0 && state === 'play' ? (Math.floor(now / 60) % 2 ? 4 : -4) : 0;     // he shakes while he gets rid of the acorn
  $('man').setAttribute('transform', `translate(${g.X - D.FX + jit} 0)` + (sq !== 1 ? ` translate(${D.FX} ${D.G}) scale(${2 - sq} ${sq}) translate(${-D.FX} ${-D.G})` : '') + (g.face > 0 ? ` translate(${2 * D.FX} 0) scale(-1 1)` : ''));
  const box = g.mode === 'box' && state !== 'menu';
  show($('boxC'), box); if (box) $('boxC').setAttribute('transform', `translate(${g.X + D.BOXOFF * g.face - D.BL} ${D.CARRY - (g.moving && k ? 8 : 0) - (D.G - 120)})`);
  show($('overL'), g.phase === 'lay' && g.side === 'L'); show($('overR'), g.phase === 'lay' && g.side === 'R');
  for (const key in g.piles) { const n = Math.min(g.piles[key].n, cap(key)); for (let i = 0; i < D.NSLOT; i++) show($('s' + key + i), i < n); }
  const w = Math.floor(now / 83) % 2 ? 5 : -5;
  for (const o of g.olives) {
    const el = $('o' + o.i);
    if (o.st === 'gone') { show(el, false); show($('l' + o.i), false); continue; }
    show(el, true); show($('k' + o.i), o.st === 'wiggle'); show($('l' + o.i), state === 'play' && (o.st === 'wiggle' || (o.st === 'fall' && !o.bonked)));
    if (o.st === 'fall') el.setAttribute('transform', `translate(${o.x} ${o.y}) rotate(${o.spin}) scale(${Math.min(1, o.s0 + (o.y - o.y0) / 300)})`);
    else if (o.st === 'wiggle') el.setAttribute('transform', `translate(${o.x0 + w} ${o.y0}) rotate(${w * 3}) scale(${o.s0 * 1.45})`);
    else el.setAttribute('transform', `translate(${o.x0} ${o.y0}) scale(${o.s0 * (o.st === 'grow' ? 1 - o.t / 0.35 : 1)})`);
  }
  for (let i = 0; i < 2; i++) {
    const s = g.squirrels.find(q => q.k === i), el = $('sq' + i); show(el, !!s); if (!s) { if (sqShown[i]) { show($(sqShown[i]), false); sqShown[i] = ''; } continue; }
    const id = 'sq' + i + (s.thrown ? 'throw' : 'sit') + '_' + v; if (id !== sqShown[i]) { if (sqShown[i]) show($(sqShown[i]), false); show($(id), true); sqShown[i] = id; }
    const [px, py] = D.PERCH[s.p], pop = Math.max(0.01, Math.min(1, s.t / 0.15, (1.9 - s.t) / 0.15)), lean = !s.thrown && s.t > 0.7 ? 10 : 0;   // pops up, leans back to wind up, pops away
    el.setAttribute('transform', `translate(${px} ${py}) scale(${-s.face * pop} ${pop}) rotate(${lean}) translate(${-D.SQREF[0]} ${-D.SQREF[1]})`);
  }
  for (let i = 0; i < 6; i++) { const a = g.acorns[i], el = $('a' + i); show(el, !!a); if (a) el.setAttribute('transform', `translate(${a.x} ${a.y}) rotate(${a.spin})`); }
  for (let i = 0; i < 6; i++) { const s = g.splats[i], el = $('x' + i); show(el, !!s && s.t > 0); if (s && s.t > 0) { el.setAttribute('transform', `translate(${s.x} ${D.G - 6})`); el.style.opacity = Math.min(1, s.t); } }
  const m = state === 'play' && (g.queued || g.tgt); show($('mark'), !!m); if (m) $('mark').setAttribute('transform', `translate(${m.mark} ${D.G + 30})`);
  show($('bonk'), g.bonkT > 0); if (g.bonkT > 0) $('bonk').setAttribute('transform', `translate(${g.bonkX + (g.squash ? 150 : 0)} ${(g.squash ? D.HAT - 40 : D.HANDY - 90) - 40 * (0.6 - g.bonkT)})`);
  if (g.score !== lastScore) { lastScore = g.score; $('score').textContent = g.score; }
  for (let i = 0; i < 3; i++) show($('lost' + i), i < g.miss);
  show($('tally'), g.boxes > 0); if (g.boxes > 0) $('boxes').textContent = '× ' + g.boxes;
}
function hud(playing) {
  show($('hud'), state !== 'menu'); show($('menu'), !playing); show($('score'), playing);
  if (!playing) {
    $('hint').textContent = '';
    if (state === 'over') { $('title').textContent = 'Almost.'; $('sub').textContent = (g.newBest ? 'New best! ' : '') + g.score + (g.score === 1 ? ' olive' : ' olives') + ' in the box.'; }
    $('bestHand').textContent = best.hand ? 'best: ' + best.hand : ''; $('bestBox').textContent = best.box ? 'best: ' + best.box : '';
  }
}

// ---------- input
function artX(e) { const r = film.getBoundingClientRect(); return ((e.clientX - r.left) / r.width * 1080 - D.TX) / D.Z; }
let down = false;
film.addEventListener('pointerdown', e => { if (e.target.closest('.btn')) return; down = true; aim(artX(e)); });
film.addEventListener('pointermove', e => { if (down && state === 'play' && g.mode === 'box') aim(artX(e)); });
addEventListener('pointerup', () => { down = false; }); addEventListener('pointercancel', () => { down = false; });
const press = (id, fn) => { const el = $(id); el.addEventListener('click', fn); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); };
press('bHand', () => start('hand')); press('bBox', () => start('box'));
press('bSound', () => { mute = !mute; $('soundT').textContent = 'sound: ' + (mute ? 'off' : 'on'); });
addEventListener('keydown', e => { if (state !== 'play') return; if (e.key === 'ArrowLeft') g.keys.l = true; if (e.key === 'ArrowRight') g.keys.r = true; });
addEventListener('keyup', e => { if (!g) return; if (e.key === 'ArrowLeft') g.keys.l = false; if (e.key === 'ArrowRight') g.keys.r = false; });

// ---------- go. The game runs on the clock, not on how fast the screen can draw: a slow computer shows fewer pictures a second but the olives fall just as fast.
let last = 0, owed = 0; const STEP = 1 / 120;
function tick(dt) {
  if (state === 'play') update(dt);
  else if (state === 'over') { g.t += dt; if (g.bonkT > 0) g.bonkT -= dt; for (const o of g.olives) if (o.st === 'fall') { o.vy += 1500 * dt; o.y = Math.min(D.G - 12, o.y + o.vy * dt); } for (const a of g.acorns) if (a.y < D.G - 10) { a.vy += 1500 * dt; a.y = Math.min(D.G - 10, a.y + a.vy * dt); a.x += a.vx * dt; } }
}
function frame(now) {
  owed += Math.min(0.25, (now - last) / 1000 || 0); last = now;
  while (owed >= STEP) { tick(STEP); owed -= STEP; }
  draw(now); requestAnimationFrame(frame);
}
function boot(data) { if (data && data.best) best = Object.assign(best, data.best); g = newGame('hand'); state = 'menu'; hud(false); requestAnimationFrame(frame); }
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ best }));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
window.oliveCatch = { get g() { return g; }, get state() { return state; }, aim, start, version: 4 };
})();
</script>
</body></html>
