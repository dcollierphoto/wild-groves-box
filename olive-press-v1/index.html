  show($('bonk'), g.bonkT > 0); if (g.bonkT > 0) $('bonk').setAttribute('transform', `translate(${g.bonkX} ${(g.squash ? D.HAT - 40 : D.RIM - 190) - 40 * (0.8 - g.bonkT)})`);
  if (run) {
    const txt = run.day + '|' + g.cnt.b + '|' + g.cnt.g + '|' + Math.floor(run.oil / D.BOT);
    if (txt !== lastTxt) { lastTxt = txt; $('dayT').textContent = `Day ${run.day} of ${D.DAYS}`; $('cntB').textContent = g.cnt.b; $('cntG').textContent = g.cnt.g; $('botT').textContent = Math.floor(run.oil / D.BOT); }
    const u = Math.min(1, g.clock / D.DAY), a = u * 2 * Math.PI, R = 58;
    $('hand').setAttribute('transform', `rotate(${u * 360})`);
    $('wedge').setAttribute('d', u <= 0 ? '' : u >= 1 ? `M0 ${-R} A${R} ${R} 0 1 1 -0.01 ${-R} Z` : `M0 0 L0 ${-R} A${R} ${R} 0 ${u > 0.5 ? 1 : 0} 1 ${R * Math.sin(a)} ${-R * Math.cos(a)} Z`);
  }
}

// ---------- input
function pt(e) { const r = film.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1080, (e.clientY - r.top) / r.height * 1920]; }
film.addEventListener('pointerdown', e => { if (e.target.closest('.btn')) return; const [x, y] = pt(e); if (state === 'mill') tapBoard(x, y); else aim((x - D.TX) / D.Z); });
const press = (id, fn) => { const el = $(id); el.addEventListener('click', fn); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); };
press('bPlay', startRun); press('bNext', nextDay);
press('bSound', () => { mute = !mute; $('soundT').textContent = 'sound: ' + (mute ? 'off' : 'on'); });
addEventListener('keydown', e => { if (state !== 'play') return; if (e.key === 'ArrowLeft') g.keys.l = true; if (e.key === 'ArrowRight') g.keys.r = true; });
addEventListener('keyup', e => { if (!g) return; if (e.key === 'ArrowLeft') g.keys.l = false; if (e.key === 'ArrowRight') g.keys.r = false; });

// ---------- go. The game runs on the clock, not on how fast the screen can draw.
let last = 0, owed = 0; const STEP = 1 / 120;
function frame(now) {
  owed += Math.min(0.25, (now - last) / 1000 || 0); last = now;
  while (owed >= STEP) { tick(STEP); owed -= STEP; }
  draw(now); requestAnimationFrame(frame);
}
function boot(data) { if (data && data.best) best = data.best; g = newDay(640); state = 'menu'; screen(); requestAnimationFrame(frame); }
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ best }));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
window.olivePress = { get g() { return g; }, get run() { return run; }, get mill() { return mill; }, get state() { return state; }, aim, startRun, tapBoard, nextDay, tick, group, version: 1 };
})();
</script>
</body></html>
