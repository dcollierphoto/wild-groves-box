<script>
// ---------- the press puzzle: the rules, kept apart from the drawing so a robot can play and a solver can check every board
// The bin is W columns by H rows. Each cell holds a number:
//   0 empty | 1 green, 2 red, 3 black olive | 4 leaf | 5 stick | 6 cracked stick | 7 stone
//   8 millstone that rolls a row | 9 millstone that rolls a column | 10 big squeeze | 11, 12, 13 golden olive (clears every olive of colour 1, 2, 3)
// Row 0 is the bottom. Everything falls straight down; nothing new drops in, so the whole bin can be cleared if you plan it.
const PZ = (() => {
  const isOlive = v => v >= 1 && v <= 3, isJunk = v => v >= 4 && v <= 7, isPow = v => v >= 8;
  const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function make(W, H, g) { return { W, H, g: g || new Int8Array(W * H), id: null }; }
  function clone(s) { const t = make(s.W, s.H, s.g.slice()); return t; }
  const at = (s, c, r) => (c < 0 || c >= s.W || r < 0 || r >= s.H) ? -1 : s.g[c * s.H + r];
  function group(s, i) {                                   // the olives of one colour touching the one tapped
    const v = s.g[i]; if (!isOlive(v)) return [];
    const seen = new Uint8Array(s.W * s.H), out = [i]; seen[i] = 1;
    for (let k = 0; k < out.length; k++) { const c = Math.floor(out[k] / s.H), r = out[k] % s.H;
      for (const [dc, dr] of N4) { const u = c + dc, w = r + dr; if (u < 0 || u >= s.W || w < 0 || w >= s.H) continue; const j = u * s.H + w; if (!seen[j] && s.g[j] === v) { seen[j] = 1; out.push(j); } } }
    return out;
  }
  function fall(s) {                                       // close every column up; returns where each cell went, for the drawing
    const moves = [];
    for (let c = 0; c < s.W; c++) { let w = 0; for (let r = 0; r < s.H; r++) { const i = c * s.H + r, v = s.g[i]; if (!v) continue;
      if (w !== r) { const j = c * s.H + w; s.g[j] = v; s.g[i] = 0; if (s.id) { s.id[j] = s.id[i]; s.id[i] = -1; } moves.push([i, j]); } w++; } }
    return moves;
  }
  function hit(s, i, ev) {                                 // one knock on a piece of junk
    const v = s.g[i];
    if (v === 4 || v === 6 || v === 7) { ev.gone.push([i, v, s.id ? s.id[i] : -1]); s.g[i] = 0; ev.junk++; }
    else if (v === 5) { s.g[i] = 6; ev.cracked.push(i); }
  }
  function powerFor(n, cells, H) {                         // what a big group turns into
    if (n >= 9) return 'gold'; if (n >= 7) return 10;
    if (n >= 5) { let c0 = 99, c1 = -1, r0 = 99, r1 = -1; for (const i of cells) { const c = Math.floor(i / H), r = i % H; c0 = Math.min(c0, c); c1 = Math.max(c1, c); r0 = Math.min(r0, r); r1 = Math.max(r1, r); }
      return (c1 - c0) >= (r1 - r0) ? 8 : 9; }              // a wide group rolls a row, a tall one rolls a column
    return 0;
  }
  // tap cell i. Returns null if nothing happens, otherwise what happened (for the drawing and the score) and the bin is changed in place
  function tap(s, i) {
    const v = s.g[i], ev = { kind: '', olives: 0, junk: 0, gone: [], cracked: [], made: 0, at: i, area: [], power: 0, moves: [] };
    if (isOlive(v)) {
      const grp = group(s, i); if (grp.length < 2) return null;
      ev.kind = 'group'; ev.olives = grp.length;
      const junkHit = new Set();
      for (const j of grp) { const c = Math.floor(j / s.H), r = j % s.H; for (const [dc, dr] of N4) { const u = c + dc, w = r + dr; if (u < 0 || u >= s.W || w < 0 || w >= s.H) continue; const k = u * s.H + w; if (s.g[k] >= 4 && s.g[k] <= 6) junkHit.add(k); } }
      for (const j of grp) { ev.gone.push([j, s.g[j], s.id ? s.id[j] : -1]); s.g[j] = 0; }
      for (const k of junkHit) hit(s, k, ev);
      let p = powerFor(grp.length, grp, s.H); if (p === 'gold') p = 10 + v;
      if (p) { s.g[i] = p; ev.made = p; if (s.id) s.id[i] = -2; }    // the drawing gives the new piece a fresh id
    } else if (isPow(v)) {
      ev.kind = 'power'; blastFrom(s, i, ev, true);
    } else return null;
    ev.moves = fall(s);
    return ev;
  }
  function areaOf(s, c, r, kind) {
    const out = [];
    for (let u = 0; u < s.W; u++) for (let w = 0; w < s.H; w++) {
      const dx = Math.abs(u - c), dy = Math.abs(w - r);
      if (kind === 'row' ? w === r : kind === 'col' ? u === c : kind === 'cross' ? (u === c || w === r) : kind === 'squeeze' ? dx + dy <= 2 :
          kind === 'big3' ? (dx <= 1 || dy <= 1) : kind === 'huge' ? dx + dy <= 4 : true) out.push(u * s.H + w);
    }
    return out;
  }
  function blastFrom(s, i, ev, combine) {
    const c = Math.floor(i / s.H), r = i % s.H, v = s.g[i];
    let mates = [i];
    if (combine) for (const [dc, dr] of N4) { const j = at(s, c + dc, r + dr); if (j >= 8) mates.push((c + dc) * s.H + r + dr); }
    const kinds = mates.map(j => s.g[j]), gold = kinds.filter(k => k >= 11), mills = kinds.filter(k => k === 8 || k === 9), sq = kinds.filter(k => k === 10).length;
    for (const j of mates) { ev.gone.push([j, s.g[j], s.id ? s.id[j] : -1]); s.g[j] = 0; }
    ev.power = Math.max(ev.power, mates.length);
    let area;
    if (gold.length >= 2) area = areaOf(s, c, r, 'all');                                     // two golden olives together: the whole bin
    else if (gold.length) {                                                                  // a golden olive alone: every olive of its colour, and the junk touching them
      const col = gold[0] - 10, hits = new Set(); area = [];
      for (let j = 0; j < s.g.length; j++) if (s.g[j] === col) { area.push(j); const u = Math.floor(j / s.H), w = j % s.H; for (const [dc, dr] of N4) { const k = at(s, u + dc, w + dr); if (k >= 4 && k <= 6) hits.add((u + dc) * s.H + w + dr); } }
      for (const j of area) { ev.gone.push([j, s.g[j], s.id ? s.id[j] : -1]); s.g[j] = 0; ev.olives++; }
      for (const k of hits) hit(s, k, ev);
      ev.area.push(...area);
      if (mates.length > 1) { const extra = areaOf(s, c, r, sq ? 'squeeze' : 'cross'); ev.area.push(...extra); blastArea(s, extra, ev, false); }   // with a partner, its blast goes off too
      return;
    }
    else if (sq >= 2) area = areaOf(s, c, r, 'huge');
    else if (sq && mills.length) area = areaOf(s, c, r, 'big3');
    else if (mills.length >= 2) area = areaOf(s, c, r, 'cross');
    else if (sq) area = areaOf(s, c, r, 'squeeze');
    else area = areaOf(s, c, r, v === 8 ? 'row' : 'col');
    ev.area.push(...area);
    blastArea(s, area, ev, gold.length >= 2);
  }
  function blastArea(s, area, ev, wipe) {
    const chain = [];
    for (const j of area) { const w = s.g[j]; if (!w) continue;
      if (isOlive(w)) { ev.gone.push([j, w, s.id ? s.id[j] : -1]); s.g[j] = 0; ev.olives++; }
      else if (isJunk(w)) { if (wipe) { ev.gone.push([j, w, s.id ? s.id[j] : -1]); s.g[j] = 0; ev.junk++; } else hit(s, j, ev); }
      else if (isPow(w)) chain.push(j); }
    for (const j of chain) if (s.g[j]) blastFrom(s, j, ev, false);                            // power-ups caught in a blast go off too
  }
  function moves(s) {                                      // one tap per group, plus every power-up
    const seen = new Uint8Array(s.W * s.H), out = [];
    for (let i = 0; i < s.g.length; i++) { const v = s.g[i]; if (!v || seen[i]) continue;
      if (isPow(v)) out.push({ i, n: 0, p: v });
      else if (isOlive(v)) { const grp = group(s, i); for (const j of grp) seen[j] = 1; if (grp.length >= 2) out.push({ i, n: grp.length, cells: grp }); } }
    return out;
  }
  const count = s => { let o = 0, j = 0; for (const v of s.g) { if (isOlive(v) || isPow(v)) o++; else if (isJunk(v)) j++; } return { o, j, all: o + j }; };
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function junkNear(s, cells) { let n = 0; const seen = new Set(); for (const j of cells) { const c = Math.floor(j / s.H), r = j % s.H; for (const [dc, dr] of N4) { const k = at(s, c + dc, r + dr); if (k >= 4 && k <= 6 && !seen.has(k + ',' + dc)) { seen.add(k + ',' + dc); n++; } } } return n; }
  // play the bin out at random, leaning towards big groups and groups that touch junk. Returns the taps and what was left.
  function rollout(s0, R, greed) {
    const s = clone(s0), path = [];
    for (let guard = 0; guard < 400; guard++) {
      const ms = moves(s); if (!ms.length) break;
      let tot = 0; const w = ms.map(m => { const x = m.p ? 3 + greed : Math.pow(m.n, 1 + greed * 0.5) + 2 * junkNear(s, m.cells); tot += x; return x; });
      let q = R() * tot, k = 0; while (q > w[k] && k < ms.length - 1) { q -= w[k]; k++; }
      path.push(ms[k].i); tap(s, ms[k].i);
    }
    return { path, left: count(s) };
  }
  // try many play-throughs; report how often the bin comes out completely clean, and one clean way through
  function solve(s0, tries, seed) {
    const R = rng(seed || 1); let wins = 0, best = null, bestLeft = 1e9;
    for (let t = 0; t < tries; t++) {
      const res = rollout(s0, R, (t % 3) * 0.5);
      if (res.left.all === 0) { wins++; if (!best || res.path.length < best.length) best = res.path; bestLeft = 0; }
      else if (!best && res.left.all < bestLeft) bestLeft = res.left.all;
      if (wins >= 3 && t > tries / 4) return { rate: wins / (t + 1), path: best, left: 0, tries: t + 1 };
    }
    return { rate: wins / tries, path: best, left: best ? 0 : bestLeft, tries };
  }

function pzHint() {                                                    // after a long pause, wiggle a move that still leads to a spotless press, if there is one
